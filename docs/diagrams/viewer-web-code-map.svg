<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">BIM 4D Viewer 코드 구조와 호출 관계</title>
  <desc id="desc">HTML 화면, Shell 패널, Kernel, 기능 컴포넌트, Adapter, Domain 및 파일 읽기 흐름을 연결한 다이어그램</desc>
  <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#182235}.title{font-size:31px;font-weight:700}.sub{font-size:15px;fill:#536174}.head{font-size:19px;font-weight:700;fill:#fff}.box{stroke-width:2}.label{font-size:17px;font-weight:650}.small{font-size:14px;fill:#415168}.arrow{fill:none;stroke:#4c6382;stroke-width:2.5;marker-end:url(#arrow)}.event{stroke-dasharray:7 5}.tag{font-size:13px;fill:#fff;font-weight:650}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4c6382"/></marker></defs>
  <rect width="1600" height="980" fill="#f7f9fc"/>
  <text x="60" y="60" class="title">BIM 4D Viewer — 화면·파일·코드 의존성 맵</text><text x="60" y="88" class="sub">main.ts가 UI(Shell), 기능(Component), 외부 기술(Adapter)을 조립한다.</text>
  <g><rect x="60" y="130" width="310" height="170" rx="14" class="box" fill="#e8f1ff" stroke="#4f82cf"/><rect x="60" y="130" width="310" height="42" rx="14" fill="#3e72bd"/><text x="82" y="158" class="head">화면 골격 · index.html</text><text x="82" y="203" class="label">Header / Workspace / Footer</text><text x="82" y="230" class="small">data-testid가 Shell 연결점</text><text x="82" y="254" class="small">전역 CSS와 스크롤 규칙도 여기</text><text x="82" y="278" class="small">IFC·Schedule 파일 input</text></g>
  <g><rect x="495" y="130" width="290" height="170" rx="14" class="box" fill="#f3ebff" stroke="#8a5fc1"/><rect x="495" y="130" width="290" height="42" rx="14" fill="#7650aa"/><text x="517" y="158" class="head">Composition Root · main.ts</text><text x="517" y="203" class="label">모든 Component 등록</text><text x="517" y="230" class="small">Adapter/Repository 의존성 주입</text><text x="517" y="254" class="small">시작: World → Model → UI</text><text x="517" y="278" class="small">종료 시 역순으로 자원 해제</text></g>
  <g><rect x="910" y="130" width="315" height="170" rx="14" class="box" fill="#fff3df" stroke="#c98a2e"/><rect x="910" y="130" width="315" height="42" rx="14" fill="#b9791d"/><text x="932" y="158" class="head">Kernel · src/kernel</text><text x="932" y="203" class="label">Component Registry</text><text x="932" y="230" class="small">initialize/start · stop/dispose</text><text x="932" y="254" class="small">Typed Command Dispatcher</text><text x="932" y="278" class="small">Typed Event Bus</text></g>
  <path d="M370 215H495M785 215H910" class="arrow"/>
  <g><rect x="60" y="390" width="400" height="260" rx="14" class="box" fill="#e4f8f3" stroke="#258c79"/><rect x="60" y="390" width="400" height="42" rx="14" fill="#207968"/><text x="82" y="418" class="head">Shell UI · src/shell</text><text x="82" y="463" class="label">모델/공간/속성/시점/절단/가시성</text><text x="82" y="490" class="label">일정/Gantt 행 편집/4D 재생 패널</text><text x="82" y="521" class="small">DOM listener: change · click · input</text><text x="82" y="547" class="small">Command 발행, Event 구독 후 UI 갱신</text><text x="82" y="585" class="small">IFC: File.arrayBuffer() / 일정: File.text()</text><text x="82" y="617" class="small">스크롤: index.html CSS overflow: auto</text></g>
  <g><rect x="580" y="365" width="455" height="310" rx="14" class="box" fill="#eef1ff" stroke="#586cc5"/><rect x="580" y="365" width="455" height="42" rx="14" fill="#4b61b8"/><text x="602" y="393" class="head">Feature Components · viewer / scheduler / simulation</text><text x="602" y="438" class="label">Model Loading</text><text x="820" y="438" class="small">Header 검증 · SHA-256 · queue</text><text x="602" y="470" class="label">Viewer</text><text x="710" y="470" class="small">selection · visibility · camera · section · viewpoint</text><text x="602" y="502" class="label">Scheduler</text><text x="730" y="502" class="small">parse · validate · edit · export</text><text x="602" y="534" class="label">Simulation</text><text x="738" y="534" class="small">일정 → 4D 표시 상태 계산</text><text x="602" y="581" class="small">Command handler를 등록하고 Event를 발행한다.</text><text x="602" y="612" class="small">DOM/That Open 대신 Port에 의존한다.</text><text x="602" y="643" class="small">Command: 의도 1개 → handler 1개 / Event: 완료 사실 → 구독자 다수</text></g>
  <g><rect x="1160" y="390" width="380" height="260" rx="14" class="box" fill="#fff0f0" stroke="#c65b5b"/><rect x="1160" y="390" width="380" height="42" rx="14" fill="#b94a4a"/><text x="1182" y="418" class="head">Adapter · src/adapters</text><text x="1182" y="463" class="label">thatOpenViewerAdapter.ts</text><text x="1182" y="490" class="small">IfcLoader.setup() / IfcLoader.load(bytes)</text><text x="1182" y="516" class="small">Fragments · picking · property · spatial</text><text x="1182" y="542" class="small">visibility · camera · clipper · 4D highlight</text><text x="1182" y="585" class="label">In-memory repositories</text><text x="1182" y="612" class="small">Model metadata / current Schedule</text></g>
  <path d="M460 520H580" class="arrow"/><path d="M580 558H460" class="arrow event"/><path d="M1035 520H1160" class="arrow"/><rect x="480" y="484" width="80" height="22" rx="8" fill="#207968"/><text x="493" y="500" class="tag">Command</text><rect x="477" y="566" width="86" height="22" rx="8" fill="#4b61b8"/><text x="492" y="582" class="tag">Event</text><rect x="1050" y="484" width="93" height="22" rx="8" fill="#4b61b8"/><text x="1063" y="500" class="tag">Port call</text>
  <g><rect x="360" y="760" width="375" height="160" rx="14" class="box" fill="#f0f2f5" stroke="#6e7784"/><rect x="360" y="760" width="375" height="42" rx="14" fill="#5d6877"/><text x="382" y="788" class="head">@bim4d/domain</text><text x="382" y="833" class="label">IFC Header · Schedule · 4D</text><text x="382" y="860" class="small">순수 파싱·검증·편집·표시 상태 규칙</text><text x="382" y="887" class="small">UI, That Open, Three.js에 의존하지 않음</text></g>
  <g><rect x="865" y="760" width="375" height="160" rx="14" class="box" fill="#f0f2f5" stroke="#6e7784"/><rect x="865" y="760" width="375" height="42" rx="14" fill="#5d6877"/><text x="887" y="788" class="head">@bim4d/contracts</text><text x="887" y="833" class="label">Command · Event · Port · DTO</text><text x="887" y="860" class="small">각 계층이 공유하는 타입 계약</text><text x="887" y="887" class="small">구현/프레임워크는 포함하지 않음</text></g>
  <g><rect x="1270" y="760" width="270" height="160" rx="14" class="box" fill="#e8f1ff" stroke="#4f82cf"/><rect x="1270" y="760" width="270" height="42" rx="14" fill="#3e72bd"/><text x="1292" y="788" class="head">파일 흐름</text><text x="1292" y="833" class="small">IFC File → Uint8Array</text><text x="1292" y="859" class="small">Schedule File → text/JSON/CSV</text><text x="1292" y="885" class="small">원본 파일은 읽기 전용</text></g>
  <path d="M705 675L590 760M900 675L1045 760M405 300L240 390M460 610L1270 820" class="arrow"/>
</svg>
