<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BIM 4D Viewer</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }

      #app {
        display: grid;
        /* 머리글 · 작업 영역 · 4D 타임라인. */
        grid-template-rows: auto 1fr auto;
        height: 100%;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.4rem 0.6rem;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid rgb(0 0 0 / 15%);
      }

      /* 버튼 글자가 세로로 눌리지 않게 한다. 자리가 모자라면 헤더가 다음 줄로 넘어간다. */
      header button {
        white-space: nowrap;
        flex: none;
      }

      h1 {
        font-size: 1rem;
        margin: 0;
      }

      .spacer {
        flex: 1;
      }

      .file-label {
        font-size: 0.85rem;
        cursor: pointer;
      }

      .file-label input {
        max-width: 12rem;
      }

      #model-status {
        font-size: 0.8rem;
        margin: 0;
        min-width: 10rem;
      }

      .divider {
        width: 1px;
        align-self: stretch;
        background: rgb(128 128 128 / 35%);
      }

      #section-status {
        font-size: 0.8rem;
        margin: 0;
        min-width: 6rem;
        opacity: 0.75;
      }

      #visibility-status {
        font-size: 0.8rem;
        margin: 0;
        min-width: 5rem;
        opacity: 0.75;
      }

      #selection-globalid {
        font-size: 0.8rem;
        margin: 0;
        min-width: 12rem;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }

      #kernel-status {
        font-size: 0.8rem;
        opacity: 0.7;
        margin: 0;
      }

      #workspace {
        display: grid;
        grid-template-columns: 18rem 1fr 20rem;
        min-height: 0;
      }

      #viewpoints {
        border-top: 1px solid rgb(0 0 0 / 15%);
        margin-top: 0.75rem;
        padding-top: 0.5rem;
      }

      /*
       * 일정 칸은 넷째 줄에 못박는다. 자동 배치에 맡기면 감춰졌을 때 다른 칸이 밀린다.
       */
      #schedule-panel {
        grid-row: 4;
        border-top: 1px solid rgb(0 0 0 / 15%);
        padding: 0.5rem;
        max-height: 16rem;
        overflow: auto;
      }

      #schedule-panel h2 {
        font-size: 0.8rem;
        margin: 0 0 0.35rem;
      }

      #task-list,
      #schedule-warnings {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      #task-list li {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.4rem;
        padding: 0.1rem 0;
        white-space: nowrap;
      }

      #task-list li[data-summary='true'] {
        font-weight: 600;
      }

      #task-list [data-testid='task-dates'],
      #task-list [data-testid='task-assigned'] {
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
        opacity: 0.7;
      }

      #schedule-warnings li {
        padding: 0.1rem 0;
        color: rgb(180 90 0);
      }

      /* 4D 타임라인은 화면 아래 한 줄에 모은다. */
      #simulation-bar {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.4rem 1rem;
        border-top: 1px solid rgb(0 0 0 / 15%);
        font-size: 0.8rem;
      }

      #simulation-time {
        flex: 1;
        min-width: 8rem;
      }

      #simulation-date {
        margin: 0;
        min-width: 6rem;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }

      #simulation-status,
      #schedule-status {
        margin: 0;
        min-width: 10rem;
        opacity: 0.75;
      }

      #viewpoints h2 {
        font-size: 0.8rem;
        margin: 0 0 0.35rem;
        opacity: 0.75;
      }

      .viewpoint-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .viewpoint-list li {
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }

      .viewpoint-restore {
        flex: 1;
        border: 0;
        background: none;
        padding: 0.15rem 0.2rem;
        cursor: pointer;
        color: inherit;
        font: inherit;
        text-align: left;
      }

      .viewpoint-restore:hover {
        background: rgb(47 125 225 / 15%);
      }

      .viewpoint-empty {
        margin: 0;
        opacity: 0.7;
      }

      #property-panel {
        border-left: 1px solid rgb(0 0 0 / 15%);
        overflow: auto;
        padding: 0.5rem 0.75rem;
        font-size: 0.8rem;
      }

      #property-panel h2 {
        font-size: 0.95rem;
        margin: 0;
      }

      #property-panel h3 {
        font-size: 0.8rem;
        margin: 0.9rem 0 0.25rem;
        opacity: 0.75;
      }

      #property-panel table {
        width: 100%;
        border-collapse: collapse;
      }

      #property-panel th,
      #property-panel td {
        text-align: left;
        vertical-align: top;
        padding: 0.1rem 0.3rem 0.1rem 0;
        font-weight: 400;
        word-break: break-word;
      }

      #property-panel th {
        width: 45%;
        opacity: 0.75;
      }

      .property-category {
        margin: 0.1rem 0 0;
        opacity: 0.7;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }

      .property-empty {
        margin: 0;
        opacity: 0.7;
      }

      #left-panel {
        display: grid;
        /* 가운데(트리)만 늘어난다. minmax(0, 1fr)이라야 트리가 넘칠 때 위아래가 밀리지 않는다. */
        /* 일정 칸은 넷째 줄이다. 감춰져 있으면 자리를 차지하지 않는다. */
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        border-right: 1px solid rgb(0 0 0 / 15%);
        min-height: 0;
        font-size: 0.8rem;
      }

      #spatial-tree {
        overflow: auto;
        min-height: 0;
        padding: 0.5rem;
      }

      #viewpoints {
        padding: 0.5rem;
        max-height: 14rem;
        overflow: auto;
      }

      #models {
        padding: 0.5rem;
        border-bottom: 1px solid rgb(0 0 0 / 15%);
        /* 퍼센트로 주면 grid 트랙이 내용을 못 세어 목록이 통째로 잘린다. 고정 상한을 쓴다. */
        max-height: 12rem;
        overflow: auto;
      }

      #models h2 {
        font-size: 0.8rem;
        margin: 0 0 0.35rem;
        opacity: 0.75;
      }

      .model-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .model-list li {
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }

      .model-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .model-empty {
        margin: 0;
        opacity: 0.7;
      }

      #spatial-tree ul {
        list-style: none;
        margin: 0;
        padding-left: 0.9rem;
      }

      #spatial-tree > ul {
        padding-left: 0;
      }

      .spatial-row {
        display: flex;
        align-items: center;
        gap: 0.15rem;
      }

      .spatial-toggle {
        width: 1.1rem;
        flex: none;
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
        color: inherit;
        font: inherit;
        text-align: center;
      }

      .spatial-node {
        border: 0;
        background: none;
        padding: 0.1rem 0.2rem;
        cursor: pointer;
        color: inherit;
        font: inherit;
        text-align: left;
        white-space: nowrap;
      }

      .spatial-node:hover {
        background: rgb(47 125 225 / 15%);
      }

      .spatial-empty {
        margin: 0;
        opacity: 0.7;
      }

      #viewer-container {
        position: relative;
        min-height: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1 data-testid="app-title">BIM 4D Viewer</h1>
        <p id="kernel-status" data-testid="kernel-status">kernel: booting</p>
        <div class="spacer"></div>
        <label class="file-label">
          IFC 열기
          <input type="file" accept=".ifc" multiple data-testid="model-file" />
        </label>
        <button type="button" data-testid="model-unload" disabled>모델 해제</button>
        <span class="divider"></span>
        <button type="button" data-testid="hide-selected" disabled>숨기기</button>
        <button type="button" data-testid="isolate-selected" disabled>격리</button>
        <button type="button" data-testid="show-all" disabled>전체 표시</button>
        <p id="visibility-status" data-testid="visibility-status"></p>
        <span class="divider"></span>
        <button type="button" data-testid="section-axis" data-axis="x">X 단면</button>
        <button type="button" data-testid="section-axis" data-axis="y">Y 단면</button>
        <button type="button" data-testid="section-axis" data-axis="z">Z 단면</button>
        <button type="button" data-testid="section-toggle" disabled>단면 끄기</button>
        <button type="button" data-testid="section-clear" disabled>단면 해제</button>
        <p id="section-status" data-testid="section-status"></p>
        <p id="model-status" data-testid="model-status">열린 모델 없음</p>
        <p id="selection-globalid" data-testid="selection-globalid">선택 없음</p>
      </header>
      <div id="workspace">
        <div id="left-panel">
          <section id="models">
            <h2>열린 모델</h2>
            <div data-testid="model-list"></div>
          </section>
          <aside id="spatial-tree" data-testid="spatial-tree"></aside>
          <section id="viewpoints">
            <h2>시점</h2>
            <button type="button" data-testid="viewpoint-save">시점 저장</button>
            <button type="button" data-testid="camera-fit">화면 맞춤</button>
            <div data-testid="viewpoint-list"></div>
          </section>
          <section id="schedule-panel" data-testid="schedule-panel" hidden>
            <h2 data-testid="schedule-name">일정 없음</h2>
            <ol id="task-list" data-testid="task-list"></ol>
            <ul id="schedule-warnings" data-testid="schedule-warnings"></ul>
          </section>
        </div>
        <main id="viewer-container" data-testid="viewer-container"></main>
        <aside id="property-panel" data-testid="property-panel"></aside>
      </div>
      <footer id="simulation-bar">
        <label class="file-label">
          일정 열기
          <input type="file" accept=".json" data-testid="schedule-file" />
        </label>
        <button type="button" data-testid="simulation-play" disabled>재생</button>
        <select data-testid="simulation-speed" disabled aria-label="배속">
          <option value="1">1일/틱</option>
          <option value="2">2일/틱</option>
          <option value="4">4일/틱</option>
        </select>
        <input type="range" data-testid="simulation-time" disabled aria-label="시뮬레이션 시각" />
        <p id="simulation-date" data-testid="simulation-date">일정 없음</p>
        <p id="simulation-status" data-testid="simulation-status"></p>
        <p id="schedule-status" data-testid="schedule-status"></p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
