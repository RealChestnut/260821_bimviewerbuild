<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BIM 4D Viewer</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }

      #app {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100%;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid rgb(0 0 0 / 15%);
      }

      h1 {
        font-size: 1rem;
        margin: 0;
      }

      #kernel-status {
        font-size: 0.8rem;
        opacity: 0.7;
        margin: 0;
      }

      #viewer-container {
        position: relative;
        min-height: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1 data-testid="app-title">BIM 4D Viewer</h1>
        <p id="kernel-status" data-testid="kernel-status">kernel: booting</p>
      </header>
      <main id="viewer-container" data-testid="viewer-container"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
