<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BIM 4D Viewer</title>
    <style>
      :root {
        color-scheme: light dark;
        /*
         * 일정 표의 열 칸. 머리글·각 줄·커서가 모두 이 값을 쓴다. 커서를 막대 칸에만
         * 겹치려면 열 칸 전체 폭(--schedule-columns-width)이 필요하다.
         */
        --schedule-columns: 6rem 16rem 6.5rem 6.5rem 3rem 6rem;
        --schedule-columns-width: calc(6rem + 16rem + 6.5rem + 6.5rem + 3rem + 6rem + 6 * 0.5rem);
        --schedule-row-height: 1.9rem;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }

      #app {
        display: grid;
        /* 머리글 · 작업 영역 · 일정 독 · 4D 타임라인. */
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        height: 100%;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.4rem 0.6rem;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid rgb(0 0 0 / 15%);
      }

      /* 버튼 글자가 세로로 눌리지 않게 한다. 자리가 모자라면 헤더가 다음 줄로 넘어간다. */
      header button {
        white-space: nowrap;
        flex: none;
      }

      h1 {
        font-size: 1rem;
        margin: 0;
      }

      .spacer {
        flex: 1;
      }

      .file-label {
        font-size: 0.85rem;
        cursor: pointer;
      }

      .file-label input {
        max-width: 12rem;
      }

      #model-status {
        font-size: 0.8rem;
        margin: 0;
        min-width: 10rem;
      }

      .divider {
        width: 1px;
        align-self: stretch;
        background: rgb(128 128 128 / 35%);
      }

      #section-status {
        font-size: 0.8rem;
        margin: 0;
        min-width: 6rem;
        opacity: 0.75;
      }

      #visibility-status {
        font-size: 0.8rem;
        margin: 0;
        min-width: 5rem;
        opacity: 0.75;
      }

      #selection-globalid {
        font-size: 0.8rem;
        margin: 0;
        min-width: 12rem;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }

      #kernel-status {
        font-size: 0.8rem;
        opacity: 0.7;
        margin: 0;
      }

      #workspace {
        display: grid;
        grid-template-columns: 18rem 1fr 20rem;
        min-height: 0;
      }

      #viewpoints {
        border-top: 1px solid rgb(0 0 0 / 15%);
        margin-top: 0.75rem;
        padding-top: 0.5rem;
      }

      /*
       * 일정 독. 뷰어 아래 화면 전폭을 쓴다.
       *
       * 18rem 사이드바 안에서는 한 달치 축이 150px에 눌려 날짜가 서로 겹치고 막대가
       * 점으로 줄었다. 표와 막대는 가로 폭을 먹는 화면이라 사이드바에 두지 않는다.
       *
       * 일정이 없으면 두 칸 다 hidden이고, 독에는 자체 여백이 없으므로 높이가 0이 된다.
       */
      #schedule-dock {
        min-height: 0;
        font-size: 0.8rem;
      }

      #schedule-panel {
        display: flex;
        align-items: baseline;
        gap: 0 0.75rem;
        flex-wrap: wrap;
        border-top: 1px solid rgb(0 0 0 / 15%);
        padding: 0.4rem 0.75rem 0;
      }

      /*
       * id 선택자의 display가 UA의 `[hidden] { display: none }`을 이긴다. display를 준
       * 칸은 감추는 규칙을 따로 적어야 일정이 없을 때 실제로 사라진다.
       */
      #schedule-panel[hidden] {
        display: none;
      }

      #schedule-panel h2 {
        font-size: 0.8rem;
        margin: 0;
      }

      /*
       * 표와 막대를 한 줄에 둔다. 열 칸은 폭이 고정이고 막대 칸이 남는 자리를 전부 쓴다.
       * 커서는 열 칸 폭만큼 밀어야 하므로 그 합을 변수 하나로 둔다.
       */
      #schedule-table {
        position: relative;
        border-top: 1px solid rgb(0 0 0 / 15%);
        /* 오른쪽은 넉넉히 둔다. 마지막 달 눈금의 날짜 글자가 들어갈 자리다. */
        padding: 0.5rem 4.5rem 0.5rem 0.75rem;
        max-height: 22rem;
        /*
         * 세로 스크롤은 줄 목록만 한다. 여기가 스크롤하면 커서가 스크롤포트를 기준으로
         * 잡혀 막대에서 어긋난다.
         */
        overflow: hidden;
      }

      #schedule-head,
      #schedule-table li {
        display: grid;
        grid-template-columns: var(--schedule-columns) minmax(0, 1fr);
        align-items: center;
        gap: 0 0.5rem;
        height: var(--schedule-row-height);
      }

      #schedule-head {
        border-bottom: 1px solid #2a2f3a;
        font-weight: 600;
        color: #8b93a7;
      }

      #schedule-table ol {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 16rem;
        overflow-y: auto;
      }

      #schedule-table li:nth-child(even) {
        background: rgb(128 128 128 / 8%);
      }

      #schedule-table li[data-summary='true'] {
        font-weight: 600;
      }

      /* 이름이 아주 길면 줄임표로 자른다. 나머지 열은 자리가 고정이라야 눈으로 훑힌다. */
      #schedule-table [data-testid='task-name'] {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #schedule-table [data-testid='task-id'],
      #schedule-table [data-testid='task-start'],
      #schedule-table [data-testid='task-finish'],
      #schedule-table [data-testid='task-assigned'] {
        white-space: nowrap;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
        font-size: 0.75rem;
        opacity: 0.75;
      }

      #schedule-table [data-testid='task-assigned'] {
        text-align: end;
      }

      #schedule-head [data-testid='gantt-axis'] {
        position: relative;
        height: 100%;
      }

      #schedule-head [data-testid='gantt-tick'] {
        position: absolute;
        top: 0;
        border-inline-start: 1px solid #2a2f3a;
        padding-inline-start: 0.25rem;
        white-space: nowrap;
        font-weight: 400;
      }

      #schedule-table [data-testid='gantt-track'] {
        position: relative;
        height: 100%;
      }

      #schedule-table [data-testid='gantt-bar'] {
        position: absolute;
        top: 25%;
        height: 50%;
        min-width: 2px;
        border-radius: 2px;
        background: #4f8cff;
      }

      #schedule-table [data-testid='gantt-bar'][data-summary='true'] {
        background: #8b93a7;
        top: 40%;
        height: 20%;
      }

      #schedule-table [data-testid='gantt-cursor'] {
        position: absolute;
        top: calc(0.5rem + var(--schedule-row-height));
        bottom: 1.6rem;
        width: 0;
        border-inline-start: 1px solid #ff9a56;
        pointer-events: none;
      }

      /*
       * 눌러서 고치는 칸. 값을 보는 자리와 고치는 자리를 같게 둔다 (79da5ac).
       * 잠긴 칸(ID, 요약 Task의 날짜)은 표시도 하지 않는다.
       */
      #schedule-table [data-editable='true'] {
        cursor: text;
        border-bottom: 1px dotted rgb(128 128 128 / 45%);
      }

      #schedule-table [data-editable='true']:focus-visible {
        outline: 1px solid #4f8cff;
      }

      /* 입력칸이 칸을 넘치면 옆 열을 밀어 줄이 어긋난다. */
      #schedule-table li input,
      #schedule-table li select {
        width: 100%;
        min-width: 0;
        font: inherit;
        font-size: 0.75rem;
        padding: 0 0.15rem;
        color: inherit;
        background: rgb(128 128 128 / 12%);
        border: 1px solid rgb(79 140 255 / 60%);
        border-radius: 2px;
      }

      #schedule-table [data-testid='row-actions'] {
        display: flex;
        gap: 0.1rem;
      }

      /* 버튼이 줄 높이를 키우면 왼쪽 열과 오른쪽 막대가 어긋난다. */
      #schedule-table [data-testid='row-actions'] button,
      #schedule-head [data-testid='task-add'],
      #schedule-table li [data-testid='dependency-remove'],
      #schedule-table li [data-testid='dependency-add'],
      #schedule-table li [data-testid='task-draft-add'],
      #schedule-table li [data-testid='task-draft-cancel'] {
        flex: none;
        font: inherit;
        font-size: 0.72rem;
        line-height: 1.1;
        padding: 0.05rem 0.3rem;
        color: inherit;
        background: none;
        border: 1px solid rgb(128 128 128 / 40%);
        border-radius: 3px;
        cursor: pointer;
      }

      #schedule-table button:disabled {
        opacity: 0.3;
        cursor: default;
      }

      #schedule-table li[data-selected='true'] {
        background: rgb(79 140 255 / 12%);
      }

      /*
       * 선후행 줄과 새 Task 줄. 열 격자를 쓰지 않고 한 줄로 펴며, ID 열만큼 들여
       * 위 줄에 딸린 것으로 보이게 한다.
       */
      #schedule-table li[data-testid='dependency-editor'],
      #schedule-table li[data-testid='task-draft'] {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        padding-inline-start: 1.5rem;
        background: rgb(79 140 255 / 8%);
        font-size: 0.75rem;
      }

      #schedule-table li[data-testid='dependency-editor'] select,
      #schedule-table li[data-testid='dependency-editor'] input,
      #schedule-table li[data-testid='task-draft'] input {
        width: auto;
        max-width: 9rem;
      }

      #schedule-table [data-testid='dependency-chips'] {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        min-width: 10rem;
      }

      #schedule-table [data-testid='dependency-chip'] {
        display: inline-flex;
        align-items: center;
        gap: 0.2rem;
        padding: 0 0.15rem 0 0.35rem;
        border: 1px solid rgb(128 128 128 / 40%);
        border-radius: 999px;
        white-space: nowrap;
      }

      #schedule-table [data-testid='dependency-empty'] {
        opacity: 0.6;
      }

      #schedule-warnings {
        display: flex;
        flex-wrap: wrap;
        gap: 0 0.75rem;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      #schedule-warnings li {
        padding: 0.1rem 0;
        color: rgb(180 90 0);
      }

      /* 4D 타임라인은 화면 아래 한 줄에 모은다. */
      #simulation-bar {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.4rem 1rem;
        border-top: 1px solid rgb(0 0 0 / 15%);
        font-size: 0.8rem;
      }

      #simulation-time {
        flex: 1;
        min-width: 8rem;
      }

      #simulation-date {
        margin: 0;
        min-width: 6rem;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }

      #simulation-status,
      #schedule-status {
        margin: 0;
        min-width: 10rem;
        opacity: 0.75;
      }

      #viewpoints h2 {
        font-size: 0.8rem;
        margin: 0 0 0.35rem;
        opacity: 0.75;
      }

      .viewpoint-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .viewpoint-list li {
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }

      .viewpoint-restore {
        flex: 1;
        border: 0;
        background: none;
        padding: 0.15rem 0.2rem;
        cursor: pointer;
        color: inherit;
        font: inherit;
        text-align: left;
      }

      .viewpoint-restore:hover {
        background: rgb(47 125 225 / 15%);
      }

      .viewpoint-empty {
        margin: 0;
        opacity: 0.7;
      }

      #property-panel {
        border-left: 1px solid rgb(0 0 0 / 15%);
        overflow: auto;
        padding: 0.5rem 0.75rem;
        font-size: 0.8rem;
      }

      #property-panel h2 {
        font-size: 0.95rem;
        margin: 0;
      }

      #property-panel h3 {
        font-size: 0.8rem;
        margin: 0.9rem 0 0.25rem;
        opacity: 0.75;
      }

      #property-panel table {
        width: 100%;
        border-collapse: collapse;
      }

      #property-panel th,
      #property-panel td {
        text-align: left;
        vertical-align: top;
        padding: 0.1rem 0.3rem 0.1rem 0;
        font-weight: 400;
        word-break: break-word;
      }

      #property-panel th {
        width: 45%;
        opacity: 0.75;
      }

      .property-category {
        margin: 0.1rem 0 0;
        opacity: 0.7;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }

      .property-empty {
        margin: 0;
        opacity: 0.7;
      }

      #left-panel {
        display: grid;
        /* 가운데(트리)만 늘어난다. minmax(0, 1fr)이라야 트리가 넘칠 때 위아래가 밀리지 않는다. */
        grid-template-rows: auto minmax(0, 1fr) auto;
        border-right: 1px solid rgb(0 0 0 / 15%);
        min-height: 0;
        font-size: 0.8rem;
      }

      #spatial-tree {
        overflow: auto;
        min-height: 0;
        padding: 0.5rem;
      }

      #viewpoints {
        padding: 0.5rem;
        max-height: 14rem;
        overflow: auto;
      }

      #models {
        padding: 0.5rem;
        border-bottom: 1px solid rgb(0 0 0 / 15%);
        /* 퍼센트로 주면 grid 트랙이 내용을 못 세어 목록이 통째로 잘린다. 고정 상한을 쓴다. */
        max-height: 12rem;
        overflow: auto;
      }

      #models h2 {
        font-size: 0.8rem;
        margin: 0 0 0.35rem;
        opacity: 0.75;
      }

      .model-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .model-list li {
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }

      .model-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .model-empty {
        margin: 0;
        opacity: 0.7;
      }

      #spatial-tree ul {
        list-style: none;
        margin: 0;
        padding-left: 0.9rem;
      }

      #spatial-tree > ul {
        padding-left: 0;
      }

      .spatial-row {
        display: flex;
        align-items: center;
        gap: 0.15rem;
      }

      .spatial-toggle {
        width: 1.1rem;
        flex: none;
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
        color: inherit;
        font: inherit;
        text-align: center;
      }

      .spatial-node {
        border: 0;
        background: none;
        padding: 0.1rem 0.2rem;
        cursor: pointer;
        color: inherit;
        font: inherit;
        text-align: left;
        white-space: nowrap;
      }

      .spatial-node:hover {
        background: rgb(47 125 225 / 15%);
      }

      .spatial-empty {
        margin: 0;
        opacity: 0.7;
      }

      #viewer-container {
        position: relative;
        min-height: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1 data-testid="app-title">BIM 4D Viewer</h1>
        <p id="kernel-status" data-testid="kernel-status">kernel: booting</p>
        <div class="spacer"></div>
        <label class="file-label">
          IFC 열기
          <input type="file" accept=".ifc" multiple data-testid="model-file" />
        </label>
        <button type="button" data-testid="model-unload" disabled>모델 해제</button>
        <span class="divider"></span>
        <button type="button" data-testid="hide-selected" disabled>숨기기</button>
        <button type="button" data-testid="isolate-selected" disabled>격리</button>
        <button type="button" data-testid="show-all" disabled>전체 표시</button>
        <p id="visibility-status" data-testid="visibility-status"></p>
        <span class="divider"></span>
        <button type="button" data-testid="section-axis" data-axis="x">X 단면</button>
        <button type="button" data-testid="section-axis" data-axis="y">Y 단면</button>
        <button type="button" data-testid="section-axis" data-axis="z">Z 단면</button>
        <button type="button" data-testid="section-toggle" disabled>단면 끄기</button>
        <button type="button" data-testid="section-clear" disabled>단면 해제</button>
        <p id="section-status" data-testid="section-status"></p>
        <p id="model-status" data-testid="model-status">열린 모델 없음</p>
        <p id="selection-globalid" data-testid="selection-globalid">선택 없음</p>
      </header>
      <div id="workspace">
        <div id="left-panel">
          <section id="models">
            <h2>열린 모델</h2>
            <div data-testid="model-list"></div>
          </section>
          <aside id="spatial-tree" data-testid="spatial-tree"></aside>
          <section id="viewpoints">
            <h2>시점</h2>
            <button type="button" data-testid="viewpoint-save">시점 저장</button>
            <button type="button" data-testid="camera-fit">화면 맞춤</button>
            <div data-testid="viewpoint-list"></div>
          </section>
        </div>
        <main id="viewer-container" data-testid="viewer-container"></main>
        <aside id="property-panel" data-testid="property-panel"></aside>
      </div>
      <div id="schedule-dock">
        <section id="schedule-panel" data-testid="schedule-panel" hidden>
          <h2 data-testid="schedule-name">일정 없음</h2>
          <ul id="schedule-warnings" data-testid="schedule-warnings"></ul>
        </section>
        <section id="schedule-table" data-testid="schedule-table" hidden>
          <div id="schedule-head">
            <span>ID</span>
            <span>Task 이름</span>
            <span>시작</span>
            <span>종료</span>
            <span>부재</span>
            <span>
              <button type="button" data-testid="task-add" title="Task 추가">+ Task</button>
            </span>
            <div data-testid="gantt-axis"></div>
          </div>
          <ol data-testid="task-rows"></ol>
          <div data-testid="gantt-cursor" hidden></div>
          <p data-testid="gantt-status"></p>
        </section>
      </div>
      <footer id="simulation-bar">
        <label class="file-label">
          일정 열기
          <input type="file" accept=".json,.csv" multiple data-testid="schedule-file" />
        </label>
        <button type="button" data-testid="schedule-export-json">JSON 내보내기</button>
        <button type="button" data-testid="schedule-export-csv">CSV 내보내기</button>
        <button type="button" data-testid="simulation-play" disabled>재생</button>
        <select data-testid="simulation-speed" disabled aria-label="배속">
          <option value="1">1일/틱</option>
          <option value="2">2일/틱</option>
          <option value="4">4일/틱</option>
        </select>
        <input type="range" data-testid="simulation-time" disabled aria-label="시뮬레이션 시각" />
        <p id="simulation-date" data-testid="simulation-date">일정 없음</p>
        <p id="simulation-status" data-testid="simulation-status"></p>
        <p id="schedule-status" data-testid="schedule-status"></p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
