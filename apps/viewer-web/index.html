<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BIM 4D Viewer</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }

      #app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100%;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid rgb(0 0 0 / 15%);
      }

      h1 {
        font-size: 1rem;
        margin: 0;
      }

      .spacer {
        flex: 1;
      }

      .file-label {
        font-size: 0.85rem;
        cursor: pointer;
      }

      .file-label input {
        max-width: 12rem;
      }

      #model-status {
        font-size: 0.8rem;
        margin: 0;
        min-width: 8rem;
      }

      /* 열린 모델은 여러 개일 수 있다. 줄마다 이름과 자기 해제 버튼을 갖는다. */
      #model-list {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        list-style: none;
        margin: 0;
        padding: 0;
        min-width: 0;
        overflow-x: auto;
      }

      #model-list li {
        display: flex;
        align-items: baseline;
        gap: 0.35rem;
        font-size: 0.8rem;
        white-space: nowrap;
      }

      .divider {
        width: 1px;
        align-self: stretch;
        background: rgb(128 128 128 / 35%);
      }

      #visibility-status {
        font-size: 0.8rem;
        margin: 0;
        min-width: 5rem;
        opacity: 0.75;
      }

      /* 4D 시뮬레이션 조작은 화면 아래 한 줄에 모은다. */
      #simulation-bar {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.4rem 1rem;
        border-top: 1px solid rgb(0 0 0 / 15%);
        font-size: 0.8rem;
      }

      #simulation-time {
        flex: 1;
        min-width: 8rem;
      }

      #simulation-date {
        margin: 0;
        min-width: 6rem;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }

      #simulation-status {
        margin: 0;
        min-width: 12rem;
        opacity: 0.75;
      }

      #selection-globalid {
        font-size: 0.8rem;
        margin: 0;
        min-width: 16rem;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }

      #kernel-status {
        font-size: 0.8rem;
        opacity: 0.7;
        margin: 0;
      }

      #viewer-container {
        position: relative;
        min-height: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1 data-testid="app-title">BIM 4D Viewer</h1>
        <p id="kernel-status" data-testid="kernel-status">kernel: booting</p>
        <div class="spacer"></div>
        <label class="file-label">
          IFC 열기
          <input type="file" accept=".ifc" data-testid="model-file" />
        </label>
        <ul id="model-list" data-testid="model-list"></ul>
        <span class="divider"></span>
        <button type="button" data-testid="hide-selected" disabled>숨기기</button>
        <button type="button" data-testid="isolate-selected" disabled>격리</button>
        <button type="button" data-testid="show-all" disabled>전체 표시</button>
        <p id="visibility-status" data-testid="visibility-status"></p>
        <p id="model-status" data-testid="model-status">열린 모델 없음</p>
        <p id="selection-globalid" data-testid="selection-globalid">선택 없음</p>
      </header>
      <main id="viewer-container" data-testid="viewer-container"></main>
      <footer id="simulation-bar">
        <label class="file-label">
          일정 열기
          <input type="file" accept=".json" data-testid="schedule-file" />
        </label>
        <button type="button" data-testid="simulation-play" disabled>재생</button>
        <select data-testid="simulation-speed" disabled aria-label="배속">
          <option value="1">1일/틱</option>
          <option value="2">2일/틱</option>
          <option value="4">4일/틱</option>
        </select>
        <input type="range" data-testid="simulation-time" disabled aria-label="시뮬레이션 시각" />
        <p id="simulation-date" data-testid="simulation-date">일정 없음</p>
        <p id="simulation-status" data-testid="simulation-status"></p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
