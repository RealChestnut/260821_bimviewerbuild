name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  verify:
    name: typecheck / lint / unit test / build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  worker:
    name: ifc worker (python)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install worker dependencies
        run: pip install -r services/ifc-worker/requirements-dev.txt

      - name: Worker unit tests
        run: python -m pytest
        working-directory: services/ifc-worker

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter "./packages/**" -r build

      # 실제 Python 워커를 자식 프로세스로 띄워 규약과 수명을 함께 본다.
      - name: Worker client tests
        run: pnpm test:worker

      # 설치본이 들고 다닐 런타임을 실제로 만들고 띄워 본다 (ADR-0011).
      # 임베더블 Python은 시스템 Python을 쓰지 않으므로 여기서만 드러나는 실패가 있다.
      - name: Build and smoke test the shipped runtime
        run: pnpm worker:runtime

  desktop:
    name: desktop shell (dotnet)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Core 테스트가 실제 Python 워커를 자식 프로세스로 띄운다 (ADR-0009).
      - name: Install worker dependencies
        run: pip install -r services/ifc-worker/requirements-dev.txt

      - name: Build
        run: dotnet build apps/desktop --nologo

      - name: Test
        run: dotnet test apps/desktop/tests/Bim4d.Desktop.Core.Tests --nologo --no-build

  e2e:
    name: browser test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
